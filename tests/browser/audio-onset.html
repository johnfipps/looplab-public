<!doctype html><!-- For browser QA, copy this file to dist/_audio-check.html and open it through the Sites preview; remove the copied file before packaging. --><html><body><h1>Audio onset regression</h1><button id="run">Run Chrome audio-render checks</button><pre id="result">Ready</pre><script type="module">
import {StudioAudio} from './audio.js';import {makeTrack,INSTRUMENT_GROUPS} from './core.js';
const rms=(d,a,b,sr)=>{let sum=0;for(let i=Math.floor(a*sr);i<Math.floor(b*sr);i++)sum+=d[i]**2;return Math.sqrt(sum/Math.floor((b-a)*sr))};
function setup(length){let c=new OfflineAudioContext(1,22050*length,22050),a=new StudioAudio();a.ctx=c;a.master=c.createGain();a.master.connect(c.destination);a.impulse=c.createBuffer(2,100,22050);a.resetReverb();return {a,c}}
document.querySelector('#run').onclick=async()=>{let results=[];try{for(let type of Object.values(INSTRUMENT_GROUPS).flat()){let {a,c}=setup(1),t=makeTrack(type,type,0),voice=a.play(t,60,.01,.3,.9,true),pause=c.suspend(.35),render=c.startRendering();await pause;voice.release();await c.resume();let b=await render,d=b.getChannelData(0),early=rms(d,.02,.1,22050);results.push({type,test:'live note-on before release',rms:early,pass:early>.001});document.querySelector('#result').textContent=JSON.stringify({running:true,results},null,2)}for(let type of Object.values(INSTRUMENT_GROUPS).flat()){let {a,c}=setup(1);a.play(makeTrack(type,type,0),60,.01,.04,.9,false);let d=(await c.startRendering()).getChannelData(0),early=rms(d,.015,.04,22050);results.push({type,test:'short scheduled note onset',rms:early,pass:early>.001})}let {a,c}=setup(4),voice=a.play(makeTrack('Organ','organ',0),60,.01,.3,.9,true),pause=c.suspend(3.1),render=c.startRendering();await pause;voice.release();await c.resume();let d=(await render).getChannelData(0),held=rms(d,2.5,2.8,22050),released=rms(d,3.4,3.7,22050);results.push({type:'organ',test:'hold beyond a bar, then release',held,released,pass:held>.01&&released<.0001});document.querySelector('#result').textContent=JSON.stringify({passed:results.filter(r=>r.pass).length,total:results.length,results},null,2)}catch(e){document.querySelector('#result').textContent=JSON.stringify({error:e.stack,results})}}
</script></body></html>
